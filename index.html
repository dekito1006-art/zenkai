<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16131a">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Zenkai – Berichte und Charakterverzeichnis für dein Naruto-RP">
  <title>Zenkai</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icon.svg" alt="" width="28" height="28"> Zenkai
      <button id="sync-badge" class="sync-badge" data-go="settings" title="Sync"></button></div>
    <nav class="nav">
      <button data-view="sessions"><span>📜</span>Sessions</button>
      <button data-view="people"><span>👥</span>Verzeichnis</button>
      <button data-view="mychars"><span>🥷</span>Meine Chars</button>
      <button data-view="settings"><span>⚙️</span>Einstellungen</button>
    </nav>
  </header>
  <main id="app"></main>
  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
  <div id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/images.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
